# nginx sert le front ET relaie /api vers le backend : une seule origine, donc pas de CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Aligné sur spring.servlet.multipart.max-request-size : au-delà, nginx répondrait 413 avant Spring.
    client_max_body_size 21m;

    # Chat en SSE : sans ces réglages, nginx accumule la réponse et le streaming arrive d'un seul bloc.
    location = /api/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers hashés par Vite : leur nom change à chaque build, on peut les mettre en cache longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : /chat ou /documents rechargés directement renvoient index.html (React Router prend le relais).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
