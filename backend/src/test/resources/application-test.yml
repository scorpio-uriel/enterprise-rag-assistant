# Valeurs factices réservées aux tests (aucun secret réel)
security:
  jwt:
    secret: test-secret-for-hs256-at-least-32-bytes-long
    ttl: 1h
  seed:
    admin-password: admin-test-password
    user-password: user-test-password
rag:
  storage-dir: target/test-uploads
  chunk-size: 200 # petits chunks : plusieurs vecteurs même sur les fixtures
  chunk-overlap: 20
  top-k: 4
  similarity-threshold: 0.3 # calibré pour le FakeEmbeddingModel, pas pour nomic-embed-text
