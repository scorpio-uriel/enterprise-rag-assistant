spring:
  application:
    name: rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag}
  jpa:
    hibernate:
      ddl-auto: validate # le schéma appartient à Flyway, Hibernate ne fait que vérifier
  servlet:
    multipart:
      max-file-size: 20MB # au-delà : MaxUploadSizeExceededException, traduite en 400 (AC2.3)
      max-request-size: 21MB
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1:8b}
          temperature: 0.1 # réponses stables, peu « créatives »
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: false # la table vector_store appartient à Flyway (V3)
        dimensions: 768 # nomic-embed-text
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  tomcat:
    max-swallow-size: 25MB # laisse Tomcat lire la fin d'un envoi trop gros pour pouvoir répondre 400

management:
  endpoints:
    web:
      exposure:
        include: health

security:
  jwt:
    secret: ${JWT_SECRET:super_secret_key_qui_fait_au_moins_trente_deux_caracteres_pour_le_dev} # >= 32 octets (HS256), jamais commité
    ttl: ${JWT_TTL:1h}
  seed:
    admin-password: ${ADMIN_PASSWORD}
    user-password: ${USER_PASSWORD}

rag:
  storage-dir: ${STORAGE_DIR:./data/uploads}
  max-file-size: 20MB
  chunk-size: 800 # en tokens
  chunk-overlap: 100 # tokens repris du chunk précédent
  top-k: 4 # nombre maximal d'extraits envoyés au LLM
  similarity-threshold: 0.55 # en dessous : refus sans appel au LLM (à calibrer au jalon J11)
