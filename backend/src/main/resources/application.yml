spring:
  application:
    name: rag
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag}
  jpa:
    hibernate:
      ddl-auto: validate # le schéma appartient à Flyway, Hibernate ne fait que vérifier
  servlet:
    multipart:
      max-file-size: 20MB # au-delà : MaxUploadSizeExceededException, traduite en 400 (AC2.3)
      max-request-size: 21MB

server:
  tomcat:
    max-swallow-size: 25MB # laisse Tomcat lire la fin d'un envoi trop gros pour pouvoir répondre 400

management:
  endpoints:
    web:
      exposure:
        include: health

security:
  jwt:
    secret: ${JWT_SECRET} # >= 32 octets (HS256), jamais commité
    ttl: ${JWT_TTL:1h}
  seed:
    admin-password: ${ADMIN_PASSWORD}
    user-password: ${USER_PASSWORD}

rag:
  storage-dir: ${STORAGE_DIR:./data/uploads}
  max-file-size: 20MB
