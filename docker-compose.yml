# Stack complète : postgres + ollama + backend + frontend (nginx).
#   cp .env.example .env    # puis renseigner les valeurs
#   docker compose up --build
#   → http://localhost:8080
# Au premier lancement, ollama-init télécharge les modèles (~3 Go) dans le volume « ollama » :
# le backend n'est démarré qu'une fois ce téléchargement terminé.
# Pour le développement quotidien, voir plutôt docker-compose.dev.yml.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # GPU NVIDIA (nécessite nvidia-container-toolkit) : décommenter pour accélérer fortement le chat.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Conteneur éphémère : télécharge les modèles puis se termine (code 0).
  # Les modèles déjà présents dans le volume ne sont pas re-téléchargés.
  ollama-init:
    image: ollama/ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      # Dans un conteneur, localhost désigne le conteneur lui-même : on vise les services par leur nom.
      DB_URL: jdbc:postgresql://postgres:5432/rag
      DB_USER: rag
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      USER_PASSWORD: ${USER_PASSWORD:?USER_PASSWORD manquant dans .env}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      # L'image JRE ne garantit pas curl : requête HTTP brute via /dev/tcp de bash.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  uploads:
