# Infra de développement : uniquement postgres + ollama.
# Le backend tourne dans l'IDE (./mvnw spring-boot:run), le front avec npm run dev.
#   docker compose -f docker-compose.dev.yml up -d
# Modèles Ollama (nécessaires à partir de J4, téléchargés une seule fois dans le volume) :
#   docker compose -f docker-compose.dev.yml exec ollama ollama pull llama3.1:8b
#   docker compose -f docker-compose.dev.yml exec ollama ollama pull nomic-embed-text
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rag}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
